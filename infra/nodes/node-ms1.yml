version: '3.8'

# ==============================================================================
# FORSA (WAMS) — Nœud Applicatif MS1 (Accounts & Shops - 2 Instances Homogènes)
# ==============================================================================
# Grâce à la migration du bot Telegram vers MS5 (Lot 5B-2), les deux instances
# MS1 sont désormais strictement identiques et interchangeables (stateless workers).
# ==============================================================================

services:
  # Instance 1 : Stateless worker
  ms1-accounts-1:
    build:
      context: ../..
      dockerfile: services/ms1-accounts/Dockerfile
    container_name: forsa-ms1-accounts-1
    restart: unless-stopped
    ports:
      - "${MS1_1_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      INSTANCE_ID: ${MS1_1_INSTANCE_ID:-ms1-accounts-1}
      # Configuration Consul & Service Discovery
      CONSUL_HOST: ${CONSUL_HOST:?CONSUL_HOST est obligatoire}
      CONSUL_PORT: ${CONSUL_PORT:-8500}
      # SERVICE_ADDRESS doit être l'adresse IP accessible depuis les autres serveurs (jamais localhost)
      SERVICE_HOST: ${SERVICE_ADDRESS:?SERVICE_ADDRESS hôte externe requis}
      SERVICE_PORT: ${MS1_1_PORT:-3001}
      # Bus RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL est obligatoire}
      EVENT_BUS_DRIVER: rabbitmq
      # Base de données PostgreSQL
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire}
      # Sécurité JWT RS256
      JWT_KEY_ID: ${JWT_KEY_ID:-forsa-ms1-auth-v1}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}
      # Telegram Bot Username (uniquement pour formater les deep links https://t.me/<username>?start=<nonce>)
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME obligatoire en prod}
      # Géocodage Nominatim
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:?GEOCODER_USER_AGENT valide obligatoire en prod}
      # Rate Limiting
      RATE_LIMIT_START_MAX: ${RATE_LIMIT_START_MAX:-3}
      TRAEFIK_START_RATE_LIMIT_AVERAGE: ${TRAEFIK_START_RATE_LIMIT_AVERAGE:-10}
      TRAEFIK_START_RATE_LIMIT_BURST: ${TRAEFIK_START_RATE_LIMIT_BURST:-20}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
    networks:
      - forsa-network

  # Instance 2 : Stateless worker strictement identique à l'instance 1
  ms1-accounts-2:
    build:
      context: ../..
      dockerfile: services/ms1-accounts/Dockerfile
    container_name: forsa-ms1-accounts-2
    restart: unless-stopped
    ports:
      - "${MS1_2_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      INSTANCE_ID: ${MS1_2_INSTANCE_ID:-ms1-accounts-2}
      # Configuration Consul & Service Discovery
      CONSUL_HOST: ${CONSUL_HOST:?CONSUL_HOST est obligatoire}
      CONSUL_PORT: ${CONSUL_PORT:-8500}
      # SERVICE_ADDRESS doit être l'adresse IP accessible depuis les autres serveurs (jamais localhost)
      SERVICE_HOST: ${SERVICE_ADDRESS:?SERVICE_ADDRESS hôte externe requis}
      SERVICE_PORT: ${MS1_2_PORT:-3002}
      # Bus RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL est obligatoire}
      EVENT_BUS_DRIVER: rabbitmq
      # Base de données PostgreSQL
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire}
      # Sécurité JWT RS256
      JWT_KEY_ID: ${JWT_KEY_ID:-forsa-ms1-auth-v1}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}
      # Telegram Bot Username (uniquement pour formater les deep links https://t.me/<username>?start=<nonce>)
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME obligatoire en prod}
      # Géocodage Nominatim
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:?GEOCODER_USER_AGENT valide obligatoire en prod}
      # Rate Limiting
      RATE_LIMIT_START_MAX: ${RATE_LIMIT_START_MAX:-3}
      TRAEFIK_START_RATE_LIMIT_AVERAGE: ${TRAEFIK_START_RATE_LIMIT_AVERAGE:-10}
      TRAEFIK_START_RATE_LIMIT_BURST: ${TRAEFIK_START_RATE_LIMIT_BURST:-20}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
    networks:
      - forsa-network

networks:
  forsa-network:
    external: true
