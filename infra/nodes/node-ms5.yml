version: '3.8'

# ==============================================================================
# FORSA (WAMS) — Nœud MS5 (Notifications & Passerelle Telegram Officielle)
# ==============================================================================
# MS5 Notifications héberge l'unique poller Telegram du cluster FORSA (Singleton).
# Replicas fixé à 1 pour garantir l'absence de conflit HTTP 409 Telegram.
# ==============================================================================

services:
  ms5-notifications:
    build:
      context: ../..
      dockerfile: services/ms5-notifications/Dockerfile
    image: forsa-ms5-notifications:latest
    container_name: forsa-ms5-notifications
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - "${MS5_PORT:-3005}:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      INSTANCE_ID: ${MS5_INSTANCE_ID:-ms5-notifications-1}
      # Bot Telegram Officiel (Singleton poller)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN requis pour MS5}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME requis}
      # Bus d'événements RabbitMQ
      EVENT_BUS_DRIVER: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requis}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-forsa.events}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      # Connexions d'infrastructure & Découverte Consul (interne, pas de tags Traefik publics)
      CONSUL_HOST: ${CONSUL_HOST:?CONSUL_HOST requis}
      CONSUL_PORT: ${CONSUL_PORT:-8500}
      SERVICE_HOST: ${SERVICE_ADDRESS:?SERVICE_ADDRESS requis}
      SERVICE_PORT: ${MS5_PORT:-3005}
    networks:
      - forsa-network

networks:
  forsa-network:
    external: true
