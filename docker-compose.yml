# FORSA — MS2 Catalogue & Search compose
# Infrastructure (RabbitMQ, Consul, Traefik) runs on the infrastructure host (S0).
# Local Docker networking connects ms2-catalogue to its private database (ms2-db).
# Remote cross-server links (RabbitMQ, Consul, MS1) use env-configured hostnames/IPs.

networks:
  ms2-net:
    driver: bridge

volumes:
  ms2-db-data:
  ms2-uploads:

services:

  # ── MS2 Database (private — only ms2-catalogue connects) ────────────────────

  ms2-db:
    image: postgres:16-alpine
    container_name: forsa-ms2-db
    networks:
      - ms2-net
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ms2_catalogue}
      POSTGRES_USER:     ${POSTGRES_USER:-ms2_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ms2_password}
    volumes:
      - ms2-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ms2_user} -d ${POSTGRES_DB:-ms2_catalogue}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MS2 — Catalogue & Search ────────────────────────────────────────────────

  ms2-catalogue:
    build:
      context: ./services/ms2-catalogue
      target:  production
    container_name: forsa-ms2
    networks:
      - ms2-net
    ports:
      - "${MS2_PUBLISH_PORT:-3002}:3002"
    depends_on:
      ms2-db: { condition: service_healthy }
    environment:
      NODE_ENV:           production
      PORT:               3002
      HOST:               0.0.0.0
      SERVICE_NAME:       ms2-catalogue
      SERVICE_ADDRESS:    ${SERVICE_ADDRESS}
      DATABASE_URL:       postgresql://${POSTGRES_USER:-ms2_user}:${POSTGRES_PASSWORD:-ms2_password}@ms2-db:5432/${POSTGRES_DB:-ms2_catalogue}
      MS1_JWT_PUBLIC_KEY: ${MS1_JWT_PUBLIC_KEY:-}
      MS1_PUBLIC_KEY_URL: ${MS1_PUBLIC_KEY_URL}
      INTERNAL_API_KEY:   ${INTERNAL_API_KEY}
      RABBITMQ_URL:       ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE:  ${RABBITMQ_EXCHANGE:-forsa.events}
      CONSUL_HOST:        ${CONSUL_HOST}
      CONSUL_PORT:        ${CONSUL_PORT:-8500}
      CORS_ORIGIN:        ${CORS_ORIGIN}
      MEDIA_BASE_URL:     ${MEDIA_BASE_URL}
      UPLOAD_DIR:         /app/uploads
      LOG_LEVEL:          info
    volumes:
      - ms2-uploads:/app/uploads
    # Traefik routing is managed via Consul Catalog tags registered by consulService.ts (Item N)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
